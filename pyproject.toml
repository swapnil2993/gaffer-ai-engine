[project]
name = "gaffer-ai-engine"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "deepeval>=4.0.5",
    "docling>=2.96.0",
    "dspy-ai>=3.2.1",
    "ebooklib>=0.20",
    "fastapi>=0.136.3",
    "html5lib>=1.1",
    "instructor>=1.15.1",
    "lxml>=6.1.1",
    "opencv-python-headless>=4.13.0.92",
    "pandas>=3.0.3",
    "presidio-analyzer>=2.2.362",
    "presidio-anonymizer>=2.2.362",
    "promptfoo>=0.1.4",
    "pydantic>=2.13.4",
    "pymilvus[milvus-lite]>=3.0.0",
    "python-multipart>=0.0.29",
    "sentence-transformers>=5.5.1",
    "spacy>=3.8.14",
    "uvicorn>=0.48.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[dependency-groups]
dev = [
    "ruff>=0.15.15",
]
