evolution_chains:
  defensive_structure:
    - "Pyramidal Formations (1920s)"
    - "→ Catenaccio (1950s)"
    - "→ German Libero Systems (1970s)"
    - "→ Low Block Counter (1990s)"
    - "→ Modern Defensive Solidity (2010s)"

  pressing_intensity:
    - "Pyramidal Formations (defensive only)"
    - "→ Total Football (1970s, high-press)"
    - "→ Tiki-taka (2000s, moderate press)"
    - "→ Gegenpressing (2010s, elite press)"

  possession_philosophy:
    - "Direct football (1920s-1950s)"
    - "→ Catenaccio counters (1950s)"
    - "→ Total Football (1970s, fluid possession)"
    - "→ Tiki-taka (2000s, possession dominance)"
    - "→ Gegenpressing (2010s, smart possession + press)"

