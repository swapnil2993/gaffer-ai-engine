case_studies:
  barcelona_2009_2011:
    title: 'Barcelona 2009-2011: Tiki-taka Peak'
    managers:
    - Pep Guardiola
    system: Tiki-taka with false 9 (Messi inverted)
    key_metrics:
      possession: 0.65
      pass_completion: 0.9
      pressing_success: 0.68
      progressive_passes_per_90: 5.5
    result: Won La Liga 2x, Champions League 2x, Copa del Rey
    key_insight: False 9 position created midfield overload; every player passed forward
  liverpool_2018_2020:
    title: 'Liverpool 2018-2020: Gegenpressing Elite'
    managers:
    - "J\xFCrgen Klopp"
    system: Gegenpressing with inverted fullbacks
    key_metrics:
      pressing_success: 0.78
      tackles_att_3rd: 0.74
      progressive_passes_per_90: 3.8
      counter_transition_speed: 2.3
    result: Won Champions League, Premier League, Club World Cup
    key_insight: "Gegenpressing at elite intensity; Salah/Man\xE9 exploit space from\
      \ turnover"
  atletico_madrid_2013_2014:
    title: "Atl\xE9tico Madrid 2013-2014: Low Block Resilience"
    managers:
    - Diego Simeone
    system: Low block + set-piece + counter
    key_metrics:
      tackles: 0.95
      interceptions: 0.8
      clearances: 0.88
      counter_transition_speed: 3.1
    result: Won La Liga; drew Champions League final (penalties)
    key_insight: Defensive solidity + set-piece threat; defeated dominance through
      structure
