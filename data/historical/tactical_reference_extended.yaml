  herbert_chapman:
    name: "Herbert Chapman"
    era: "1920s-1930s"
    systems: ["WM Formation / Pyramidal Formations"]
    key_innovation: "Systematic defense; the libero concept origin"
    legacy: "Father of modern defensive tactics"

  helenio_herrera:
    name: "Helenio Herrera"
    era: "1950s-1970s"
    systems: ["Catenaccio", "Italian Defensive Solidity"]
    key_innovation: "The libero (sweeper) as playmaker; counter-attacking precision"
    legacy: "Proved defense can be both beautiful and impenetrable"

  rinus_michels:
    name: "Rinus Michels"
