tactical_systems:
  high_press:
    display_name: "High Press / Gegenpressing"
    description: |
      Aggressive, coordinated pressing to win the ball in the attacking third within
      3-5 seconds of losing possession. Requires intense physical and cognitive demands.
    key_managers: ["Guardiola (Manchester City)", "Klopp (Liverpool)", "De Zerbi (Brighton)"]
    required_metrics:
      pressing_success:
        threshold: 0.75
        meaning: "% of pressing actions that result in possession"
      tackles_att_3rd:
        threshold: 0.70
        meaning: "Tackles per 90 in attacking third (winning ball high up pitch)"
      interceptions:
        threshold: 0.60
        meaning: "Interceptions per 90 (reading play ahead)"
    player_profile: |
      High-press midfielders combine tactical discipline with physicality. They win the
      ball high, then immediately distribute to create chances. A high-press creative
      midfielder needs: pressing_success >75%, tackles_att_3rd >0.70, interceptions >0.60,
      AND key_passes >2/90 or assists >3/season to sustain attacks from regained possession.
    concept_keywords: ["press", "gegenpressing", "aggressive", "pressure", "recovery"]

  defensive_transition:
    display_name: "Defensive Transition / Compact Defense"
    description: |
      Rapid shift from attack to defense when possession is lost. Team drops shape
      compactly and prioritizes blocking central lanes. Key to stopping counter-attacks.
      Examples: Ancelotti's Real Madrid, Pochettino's strategies, Simeone's Atlético.
    key_metrics:
      tackles: 0.70
      interceptions: 0.65
      recoveries: 0.75
      pressure_success: 0.70
    player_profile: |
      Transition defense demands positional awareness and reading the game 1-2 seconds
      ahead. Players must initiate defensive shape quickly, block passing lanes, and win
      first contact. Stats that matter: tackles >0.70/90, interceptions >0.65/90,
      recoveries >0.75/90. Midfielders must also retain the ball after winning it:
      pass completion >85% under pressure, then distribute to wide players or deeper.
    concept_keywords: ["transition", "defense", "compact", "regain", "recovery"]

  ball_progression:
    display_name: "Ball Progression / Possession Control"
    description: |
      Building play from the back through central midfielders and fullbacks. Emphasis
      on progressive passes, carries, and sustained possession to control tempo.
      Examples: Guardiola's teams, Tiki-taka Barcelona, modern Brighton.
    key_metrics:
      progressive_passes: 0.65  # PrgP
      progressive_carries: 0.60  # PrgC
      pass_completion: 0.88
      possession_pct: 0.55
    player_profile: |
      Ball progressors are the engine of possession-based systems. They must combine
      technical skill (first touch, passing range) with soccer intelligence (reading
      space, anticipating next pass). Key metrics: progressive passes >4.5/90, progressive
      carries >2.5/90, pass completion >88%, and crucially, they must avoid turnover-heavy
      passes. In modern football, a progressor who loses the ball 20% of the time is
      vulnerable to counter-attack. Creative progressors add: key passes >2/90, xA >0.08.
    concept_keywords: ["progression", "possession", "carry", "distribution", "tempo"]

  creative_playmaking:
    display_name: "Creative Playmaking / Chance Creation"
    description: |
      Attacking playmakers who generate scoring opportunities through passing, dribbling,
      or positioning. Mix of vision, technique, and game intelligence.
      Examples: Odegaard, Foden, Maddison, Bernardo Silva in advanced roles.
    key_metrics:
      assists: 0.50
      key_passes: 0.70  # KP
      expected_assists: 0.65
      shot_creating_actions: 0.70
    player_profile: |
      Creative players must balance risk-taking with efficiency. A true playmaker doesn't
      just have high assist numbers—they generate clear-cut chances (high xA, high SCA)
      and decision-making is crucial. Key metrics: assists >3-5/season (depending on
      position), xA >0.08/90, key passes >2.5/90. In transition-heavy systems, creatives
      are dangerous because they connect regained possession directly to goal-scoring
      positions. Hybrid creatives (creative + defensive transition) are the most valuable
      in modern football: Odegaard under Arteta, Rodri under Guardiola.
    concept_keywords: ["creative", "assist", "chance creation", "key pass", "playmaker"]

  goal_threat:
    display_name: "Goal Threat / Finishing"
    description: |
      Players who are lethal in and around the penalty area. Conversion rate, positioning,
      and movement in the box are paramount.
      Examples: Haaland, Mbappé, Kane, Lewandowski.
    key_metrics:
      goals: 0.60
      expected_goals: 0.65
      shot_efficiency: 0.15  # Goals/Sh
      shots_on_target_pct: 0.50
    player_profile: |
      Goal-threat players live by finishing quality. Raw goal totals can be misleading
      (dependent on volume and teammates). Better signals: xG+xAG (underlying goal output),
      shot conversion rate (goals per shot >12%), and positioning metrics (how often in
      the penalty area, how central). A 20-goal striker might have 18 xG (efficient) or
      12 xG (overperforming, regression risk). Hybrid threats (goal + ball progression)
      are strikers who can drop deep to build play: Haaland's link-up, Kane's playmaking.
    concept_keywords: ["goal", "scorer", "prolific", "finishing", "lethal"]

  low_block_defense:
    display_name: "Low Block / Counter-Attack"
    description: |
      Defensive shape sits deep, invites pressure, and prioritizes quick transitions.
      Defensive compactness and long-ball accuracy are critical.
      Examples: Simeone's Atlético, Dyche's Everton, Lopetegui's strategies.
    key_metrics:
      tackles: 0.75
      interceptions: 0.70
      clearances: 0.80
      counter_pressing: 0.40  # Lower than high-press
    player_profile: |
      Low-block defenders must be positionally disciplined and physically strong. They
      sit in a compact 4-4-2 or 4-1-4-1 shape, cede possession, and break on transitions.
      Key stats: tackles >1.0/90, interceptions >0.70/90, clearances >3/90. Fullbacks must
      be direct (long passes, crosses) rather than intricate passers. Midfielders need
      work rate (distance covered, duels won) and set-piece threat (headed goals from
      corners). A low-block midfielder who excels at tackle-to-pass ratio and quick
      distribution to wingers is invaluable in counter-attacking systems.
    concept_keywords: ["low block", "counter-attack", "compact", "deep defense"]

  fullback_progression:
    display_name: "Modern Fullback / Inverted Role"
    description: |
      Fullbacks who roam infield to create overloads in midfield while maintaining
      defensive responsibility. Rare blend of defense, progression, and risk management.
      Examples: Cancelo, TAA, Hernández, modern fullback paradigm.
    key_metrics:
      progressive_passes: 0.65
      progressive_carries: 0.60
      tackles_plus_interceptions: 1.0
      assists: 0.35
    player_profile: |
      Modern fullbacks are hybrid players: they must defend (1v1 recovery, pressure),
      progress the ball (infield passes, dribbles), and create (crosses, cutbacks). The
      best examples (Cancelo, TAA) excel across all three. Key metrics: progressive actions
      >3/90, tackles+interceptions >1.0/90, assists >2-3/season. The danger is imbalance—
      a fullback strong at progression but weak at defense is vulnerable in transition
      (exposed on the wing). Conversely, a defensive fullback who doesn't progress is
      limited in possession-based systems. Elite fullbacks maintain >85% pass completion
      while attempting risky progressive passes.
    concept_keywords: ["fullback", "inverted", "progression", "wing"]

  physical_dominance:
    display_name: "Physical Dominance / Box-to-Box"
    description: |
      High-intensity runners who dominate duels, cover ground, and set the physical tone
      of the match. Often box-to-box midfielders.
      Examples: Kanté, Rodri, Kimmich, Philips.
    key_metrics:
      tackles: 0.75
      duels_won_pct: 0.55
      distance_covered: 11.5  # km per 90
      pressure_success: 0.70
    player_profile: |
      Physical players impose themselves on the match through work rate and contact. High
      physical volume (distance covered >11 km/90, duels won >50%) and intensity (tackle
      success >70%, pressure success >65%) are hallmarks. These players thrive in high-
      intensity, direct football and set-piece situations. Key differentiator: do they
      retain possession after winning it? A fierce tackler with 60% pass completion is
      dangerous to his own team. The elite physical players (Rodri, Kanté) combine
      dominance with efficiency: tackle + pass or tackle + move forward. Box-to-box
      excellence requires both defensive and attacking thrust: tackles >1.0/90 and
      progressive actions >3/90.
    concept_keywords: ["physical", "dominant", "duels", "work rate", "box-to-box"]
